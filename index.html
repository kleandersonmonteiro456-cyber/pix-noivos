# index.html

```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento em Pix</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
}

body {
    font-family: Georgia, "Times New Roman", serif;
}

.container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;

    background-image: url("Pix.jpg");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: contain;

    background-color: #fff;
}

/* Área central do botão */
.pix-area {
    position: absolute;

    left: 50%;
    top: 57%;

    transform: translate(-50%, -50%);

    width: 90%;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

.titulo {
    margin: 0 0 14px;

    color: #000000;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(20px, 5vw, 30px);

    font-weight: bold;

    text-shadow: 0 1px 2px rgba(255,255,255,.9);
}

.botao-pix {
    width: min(72vw, 320px);

    padding: 16px 25px;

    border: none;
    border-radius: 12px;

    background: #809c52;
    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(18px, 4.5vw, 23px);
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 15px rgba(0,0,0,.20);

    transition: .2s ease;
}

.botao-pix:hover {
    background: #708b45;
}

.botao-pix:active {
    transform: scale(.96);
}

.mensagem {
    margin-top: 10px;

    color: #000000;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: bold;

    min-height: 22px;

    opacity: 0;

    transition: opacity .25s ease;
}

.mensagem.visivel {
    opacity: 1;
}

/* Celulares pequenos */
@media (max-width: 380px) {

    .pix-area {
        top: 56%;
    }

    .titulo {
        font-size: 19px;
        margin-bottom: 10px;
    }

    .botao-pix {
        padding: 14px 20px;
        font-size: 18px;
    }

    .mensagem {
        font-size: 14px;
    }
}

/* Mantém a arte na proporção 9:16 */
@media (min-aspect-ratio: 9/16) {

    .container {
        background-size: auto 100%;
    }
}

@media (max-aspect-ratio: 9/16) {

    .container {
        background-size: 100% auto;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="pix-area">

        <h1 class="titulo">
            Pagamento em Pix
        </h1>

        <button
            class="botao-pix"
            id="botaoPix"
            type="button"
        >
            Copiar Pix
        </button>

        <div
            class="mensagem"
            id="mensagem"
            aria-live="polite"
        >
            Pix Copiado
        </div>

    </div>

</div>

<script>

const PIX = "86 995722792";

const botao = document.getElementById("botaoPix");
const mensagem = document.getElementById("mensagem");

botao.addEventListener("click", async function () {

    try {

        if (navigator.clipboard && window.isSecureContext) {

            await navigator.clipboard.writeText(PIX);

        } else {

            const campo = document.createElement("textarea");

            campo.value = PIX;

            campo.style.position = "fixed";
            campo.style.left = "-9999px";

            document.body.appendChild(campo);

            campo.focus();
            campo.select();

            document.execCommand("copy");

            campo.remove();
        }

        mensagem.textContent = "Pix Copiado";
        mensagem.classList.add("visivel");

        botao.textContent = "Pix Copiado";

        setTimeout(function () {

            mensagem.classList.remove("visivel");

            botao.textContent = "Copiar Pix";

        }, 2500);

    } catch (erro) {

        mensagem.textContent = "Não foi possível copiar";
        mensagem.classList.add("visivel");

        setTimeout(function () {

            mensagem.classList.remove("visivel");
            mensagem.textContent = "Pix Copiado";

        }, 2500);
    }

});

</script>

</body>
</html>
